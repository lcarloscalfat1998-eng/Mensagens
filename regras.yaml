# Regras da casa: tudo que o motor aplica a todas as carteiras.
# Edite este arquivo para mudar o comportamento do motor. Valores em fração (0.05 = 5%).

versao: 2026-11-13

compliance:
  # Base de cálculo de todos os limites: patrimônio total do cliente.
  limite_emissor: 0.05          # crédito privado: máximo por emissor
  limite_nicho: 0.15            # máximo por setor do devedor (agro, imobiliário...)
  limite_fundo_fechado: 0.10    # FIDC, FIP, FII, Fiagro: máximo por fundo
  fgc_por_instituicao: 250000   # bancários com FGC ficam fora do limite até este valor por banco
  # Categorias que NÃO contam no limite por emissor
  excecoes_emissor: [titulo_publico, bancario_fgc, quase_soberano, fundo_aberto]
  # O que fazer quando um limite estoura: sugerir_ajuste | alertar
  acao_estouro: sugerir_ajuste
  # Produtos ignorados pelo motor (não vendemos)
  ignorar: [coe]

# Fundo que recebe os recursos dos resgates e vendas
