# Textos-padrão usados nos documentos
textos:
  exposicao_global: O resgate faz parte de uma readequação da exposição global, que será reestruturada dentro da estratégia da carteira.
  sem_liquidez: O título não tem liquidez para venda e segue na carteira. Vamos acompanhar a reestruturação da dívida com os credores e avaliar as alternativas conforme o processo avançar.
  etapa3:
    - Usar o fundo de destino como base e sair dele <b>aos poucos</b>.
    - Priorizar <b>isentos de bons emissores</b> (LCA, LCD, CRA/CRI de grau de investimento) e <b>títulos públicos</b>.
    - Travar taxas prefixadas e IPCA+ conforme a curva de juros.
  aviso_legal: Rentabilidade passada não é garantia de rentabilidade futura. Fundos de investimento não contam com garantia do administrador, do gestor, de mecanismo de seguro ou do FGC. Esta é uma sugestão e deve ser avaliada de acordo com o perfil e os objetivos do investidor.
