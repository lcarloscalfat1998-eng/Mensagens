<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Capa do grupo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Foto do grupo no WhatsApp: quadrada, exibida em círculo. Todo o conteúdo fica dentro do círculo central. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;display:flex;gap:40px;padding:40px;font-family:Inter,sans-serif}
.capa{width:1080px;height:1080px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.y{background:#FFC709;color:#000}
.k{background:#000;color:#fff}
.ring{position:absolute;inset:70px;border-radius:50%;border:3px solid currentColor;opacity:.18}
.diag{position:absolute;width:900px;height:900px;border:3px solid currentColor;opacity:.08;transform:rotate(45deg)}
.mk{font-weight:900;font-size:120px;letter-spacing:-.05em;line-height:1}
.k .mk{color:#fff}
.t{font-weight:900;font-size:150px;letter-spacing:-.055em;line-height:.9;margin-top:34px}
.k .t em{color:#FFC709}
.t em{font-style:normal}
.d{margin-top:44px;font-size:44px;font-weight:800;letter-spacing:.08em}
.k .d{color:#FFC709}
.l{margin-top:12px;font-size:28px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
</style>
</head>
<body>
<section class="capa y" data-id="capa-grupo-amarela">
  <div class="diag"></div><div class="ring"></div>
  <div class="mk">xp</div>
  <div class="t">Do Mundo<br>à Mesa</div>
  <div class="d">03.12 · 20H</div>
  <div class="l">Joinville · SC</div>
</section>
<section class="capa k" data-id="capa-grupo-preta">
  <div class="diag"></div><div class="ring"></div>
  <div class="mk">xp</div>
  <div class="t">Do Mundo<br><em>à Mesa</em></div>
  <div class="d">03.12 · 20H</div>
  <div class="l">Joinville · SC</div>
</section>
</body>
</html>
