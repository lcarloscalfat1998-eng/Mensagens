<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Do Mundo à Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta XP: preto, branco e amarelo. Ajuste --gold para o hex exato do manual de marca. */
  --ink:#000000; --ink2:#141414; --line:#2a2a2a;
  --cream:#ffffff; --muted:#a3a3a3; --gold:#FFC709;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1c1c1c;font-family:Inter,"Liberation Sans",sans-serif;padding:40px;display:flex;flex-wrap:wrap;gap:40px;justify-content:center}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--ink);color:var(--cream);padding:84px 96px 0;display:flex;flex-direction:column}
.card::after{content:"";position:absolute;right:-180px;top:-180px;width:520px;height:520px;border:2px solid var(--gold);opacity:.18;transform:rotate(45deg);pointer-events:none}
.card.y{background:var(--gold);color:#000}
.card.y::after{border-color:#000;opacity:.12}
.card.y .muted,.card.y .item span,.card.y .disc{color:rgba(0,0,0,.8)}
.card.y .lead{font-weight:400}
.card.y .gold,.card.y .kicker,.card.y .foot .cd,.card.y .big-date,.card.y h1 em{color:#000}
.card.y .question{border-color:#000}
.card.y .foot{border-color:rgba(0,0,0,.25)}
.card.y .tbd{border-color:rgba(0,0,0,.5);color:rgba(0,0,0,.7)}
.gold{color:var(--gold)}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:20px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:16px;height:64px}
.logo img{height:64px;width:auto}
.logo .mk{font-weight:900;font-size:58px;letter-spacing:-.04em;line-height:1;text-transform:lowercase}
.logo .sb{font-weight:500;font-size:22px;letter-spacing:.02em;text-transform:none;border-left:2px solid var(--gold);padding-left:16px;line-height:1.1}
.card.y .logo .sb{border-color:#000}
.chip{border:2px solid currentColor;padding:10px 20px;border-radius:6px;font-size:18px;letter-spacing:.16em}
.kicker{margin-top:56px;font-size:24px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:88px;line-height:1.02;margin-top:22px;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--gold)}
.lead{font-size:34px;line-height:1.45;margin-top:40px;font-weight:300;max-width:860px}
.list{margin-top:40px;display:flex;flex-direction:column;gap:22px}
.item{display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:start}
.item .n{font-size:30px;font-weight:800;color:#000;background:var(--gold);width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.card.y .item .n{background:#000;color:var(--gold)}
.item b{display:block;font-size:33px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
.item span{font-size:26px;line-height:1.38;color:var(--muted);font-weight:400}
.question{margin-top:auto;border-left:6px solid var(--gold);padding:6px 0 6px 30px;font-weight:600;font-size:36px;line-height:1.28;letter-spacing:-.01em}
.foot{border-top:1px solid #2a2a2a;margin:0 -96px;padding:28px 96px 60px;display:flex;justify-content:space-between;align-items:center;font-size:20px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.foot .cd{color:var(--gold);font-weight:800}
.progress{display:flex;gap:8px;margin-top:26px}
.progress i{height:6px;flex:1;background:#2a2a2a}
.progress i.on{background:var(--gold)}
.content{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:40px;position:relative;z-index:1}
.disc{font-size:16px;line-height:1.35;color:#8a8a8a;padding-bottom:20px}
.big-date{font-size:290px;line-height:.88;color:var(--gold);font-weight:900;letter-spacing:-.06em}
.stat{display:flex;align-items:center;gap:30px;margin-top:40px}
.stat .v{font-size:130px;color:var(--gold);line-height:1;font-weight:900;letter-spacing:-.05em}
.stat .l{font-size:28px;line-height:1.35;max-width:520px;color:var(--muted)}
.pillars{display:grid;grid-template-columns:1fr;gap:22px;margin-top:56px}
.pillar{background:var(--ink2);border-left:6px solid var(--gold);padding:30px 36px;display:grid;grid-template-columns:110px 1fr;align-items:center}
.pillar .r{font-size:64px;font-weight:900;color:var(--gold)}
.pillar b{font-size:36px;display:block;font-weight:700}
.pillar span{font-size:26px;color:var(--muted)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:44px 40px;margin-top:56px}
.person{display:flex;flex-direction:column;gap:10px}
.av{width:150px;height:150px;border-radius:50%;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:52px;color:var(--gold);background:var(--ink2);background-size:cover;background-position:center}
.person .role{font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:8px}
.person .nm{font-size:32px;font-weight:700}
.person .cg{font-size:23px;color:var(--muted)}
.spot .av{width:340px;height:340px;font-size:104px}
.people .av{background-size:160%;background-position:50% 8%}
.spot-bio{font-size:29px;line-height:1.45;margin-top:22px;color:var(--muted);font-weight:400}
.info{margin-top:56px;display:grid;grid-template-columns:200px 1fr;gap:26px 20px;font-size:32px}
.info dt{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:21px;font-weight:700;padding-top:8px}
.tbd{border:2px dashed rgba(255,199,9,.7);border-radius:6px;padding:0 .25em;color:inherit;opacity:.9;white-space:nowrap}
.info .tbd,.lead .tbd,.person .tbd{white-space:normal}
svg text{font-family:Inter,sans-serif}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const E = window.EVENTO;
const EVT = new Date(E.data + "T12:00:00");
const tbd = h => h.replace(/\[([^\]<]+)\]/g,'<span class="tbd">$1</span>');
const logo = () => E.logo ? `<div class="logo"><img src="${E.logo}" alt=""></div>` : `<div class="logo"><span class="mk">xp</span><span class="sb">${E.marca}</span></div>`;
const TOTAL = 8; // capítulos de conteúdo
const ini = n => n.replace(/[\[\]]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(s=>s[0]).join("").toUpperCase();
const dd = d => { const x=new Date(d+"T12:00:00"); return String(x.getDate()).padStart(2,"0")+"/"+String(x.getMonth()+1).padStart(2,"0"); };
function countdown(d){
  const n = Math.round((EVT - new Date(d+"T12:00:00"))/864e5);
  if(n>1) return `Faltam ${n} dias`; if(n===1) return "É amanhã"; if(n===0) return "É hoje"; return "Obrigado";
}
function progress(c){ if(!c) return ""; let s='<div class="progress">'; for(let i=1;i<=TOTAL;i++) s+=`<i class="${i<=c?'on':''}"></i>`; return s+'</div>'; }
function shell({id,date,cap,tag,light,body,disc}){
  return tbd(`<section class="card ${light?'y':''}" data-id="${id}">
    <div class="top">${logo()}<span class="chip">${tag}</span></div>
    ${progress(cap)}
    <div class="content">${body}</div>
    ${disc?`<div class="disc">${E.disclaimer}</div>`:""}
    <div class="foot"><span>${E.serie}</span><span>${E.cidade} · 03.12</span><span class="cd">${countdown(date)}</span></div>
  </section>`);
}
const items = arr => `<div class="list">${arr.map((x,i)=>`<div class="item"><div class="n">${String(i+1).padStart(2,"0")}</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join("")}</div>`;
const av = p => `<div class="av" style="${p.foto?`background-image:url('${p.foto}')`:''}">${p.foto?'':ini(p.nome)}</div>`;

function ecoSVG(){
  const nodes=["Investimentos","Sucessório","Tributário","Internacional","Proteção","Empresa"];
  const cx=444,cy=330,R=250; let s=`<svg width="740" height="550" viewBox="0 0 888 660">`;
  nodes.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/nodes.length;const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
    s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#FFC709" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 8"/>`;});
  nodes.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/nodes.length;const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
    s+=`<circle cx="${x}" cy="${y}" r="74" fill="#141414" stroke="#FFC709" stroke-width="2"/><text x="${x}" y="${y+8}" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="600">${n}</text>`;});
  s+=`<circle cx="${cx}" cy="${cy}" r="108" fill="#FFC709"/><text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#000" font-size="36" font-weight="700" font-weight="800">Família</text><text x="${cx}" y="${cy+32}" text-anchor="middle" fill="#000" font-size="20" font-weight="600" letter-spacing="3">NO CENTRO</text>`;
  return s+"</svg>";
}

const specialists = E.pessoas.filter(p=>p.papel!=="Anfitrião");
const cards = [
  {id:"01-save-the-date", date:"2026-11-13", tag:"Convite", light:1, body:`
    <div class="kicker">Save the date</div>
    <div class="big-date" style="margin-top:50px">03.12</div>
    <h1 style="font-size:84px;margin-top:30px">Um jantar. <em>Cinco convidados.</em> Uma conversa sobre o que vem pela frente.</h1>
    <p class="lead muted" style="margin-top:36px">${E.cidade} · ${E.horario}. Nas próximas semanas, vamos compartilhar pílulas do que estará à mesa.</p>`},
  {id:"02-agenda", date:"2026-11-16", tag:"A agenda", body:`
    <div class="kicker">O roteiro da noite</div>
    <h1>Do mundo<br><em>à sua mesa.</em></h1>
    <div class="pillars">
      <div class="pillar"><div class="r">I</div><div><b>Cenários</b><span>Geopolítico · Macro global · Brasil</span></div></div>
      <div class="pillar"><div class="r">II</div><div><b>Wealth Planning</b><span>Sucessão · Tributação · Offshore · Holdings</span></div></div>
      <div class="pillar"><div class="r">III</div><div><b>Ecossistema</b><span>Quem faz o quê na proteção do seu patrimônio</span></div></div>
    </div>`},
  {id:"03-geopolitica-macro", date:"2026-11-18", cap:1, tag:"Cenários · 1/3", disc:1, body:`
    <div class="kicker">Geopolítica & Macro global</div>
    <h1>O mundo mudou <em>de regime.</em></h1>
    ${items([["Juros globais","O ciclo dos bancos centrais redefine o custo do capital — e o preço de todos os ativos."],["Comércio fragmentado","Tarifas e a rivalidade EUA × China reorganizam cadeias e moedas."],["Risco geopolítico","Conflitos e energia deixaram de ser ruído: viraram variável de portfólio."]])}
    <div class="question">Seu patrimônio está preparado para um mundo menos previsível?</div>`},
  {id:"04-brasil", date:"2026-11-20", cap:2, tag:"Cenários · 2/3", disc:1, body:`
    <div class="kicker">Cenário político & econômico</div>
    <h1>2027 <em>começa agora.</em></h1>
    ${items([["Pós-eleição","O novo ciclo de governo e o que ele sinaliza para a agenda fiscal."],["Juros reais altos","Oportunidade na renda fixa — e armadilha para quem fica parado."],["Câmbio","O termômetro da confiança e o argumento da diversificação."]])}
    <div class="question">Quanto do seu patrimônio depende de um único cenário para o Brasil?</div>`},
  {id:"05-sucessao", date:"2026-11-23", cap:3, tag:"Wealth · Sucessão", disc:1, body:`
    <div class="kicker">Planejamento sucessório</div>
    <h1 style="font-size:80px">Patrimônio se constrói em décadas. <em>Se perde em um inventário.</em></h1>
    <div class="stat" style="margin-top:40px"><div class="v" style="font-size:130px">até 20%</div><div class="l">do patrimônio pode ser consumido por custos, impostos e tempo de um inventário mal planejado (estimativa de mercado).</div></div>
    ${items([["Instrumentos certos","Testamento, doação com usufruto, previdência, seguro e governança familiar."]])}
    <div class="question">Se algo acontecesse amanhã, sua família saberia o que fazer?</div>`},
  {id:"06-tributacao", date:"2026-11-24", cap:4, tag:"Wealth · Tributação", disc:1, body:`
    <div class="kicker">Tributação</div>
    <h1>As regras <em>mudaram.</em> E o seu plano?</h1>
    ${items([["Dividendos","Retenção de 10% de IR sobre dividendos acima de R$ 50 mil/mês por empresa (Lei 15.270/2025)."],["IR mínimo da alta renda","Tributação mínima progressiva para rendas acima de R$ 600 mil/ano."],["ITCMD progressivo","A reforma tributária (EC 132/2023) tornou as alíquotas de herança progressivas."]])}
    <div class="question">Sua estrutura foi desenhada para as regras de ontem?</div>`},
  {id:"07-offshore", date:"2026-11-25", cap:5, tag:"Wealth · Offshore", disc:1, body:`
    <div class="kicker">Patrimônio internacional</div>
    <h1>Offshore não é segredo. <em>É estratégia.</em></h1>
    ${items([["Nova tributação","Desde 2024, lucros de offshores são tributados anualmente a 15% (Lei 14.754/2023)."],["Diversificação real","Moeda forte, outras jurisdições e acesso a ativos globais."],["Estrutura certa","Conta direta, offshore, trust ou fundo: cada caso pede um desenho."]])}
    <div class="question">Sua estrutura internacional ainda faz sentido depois da nova lei?</div>`},
  {id:"08-holdings", date:"2026-11-26", cap:6, tag:"Wealth · Holdings", disc:1, body:`
    <div class="kicker">Holdings patrimoniais</div>
    <h1>Holding não é moda. <em>É arquitetura.</em></h1>
    ${items([["Organização","Imóveis, participações e investimentos sob uma gestão única."],["Sucessão em vida","Doação de quotas com cláusulas de proteção e usufruto."],["Eficiência — com critério","ITCMD, ganho de capital e custo de manutenção entram na conta."]])}
    <div class="question">A sua holding foi feita sob medida — ou de prateleira?</div>`},
  {id:"09-quem-estara-a-mesa", date:"2026-11-27", tag:"Quem estará à mesa", body:`
    <div class="kicker">Os anfitriões e especialistas</div>
    <h1 style="font-size:92px">Quem senta <em>com você.</em></h1>
    <div class="people">${E.pessoas.map(p=>`<div class="person">${av(p)}<div class="role">${p.papel}</div><div class="nm">${p.nome}</div><div class="cg">${p.cargo}</div></div>`).join("")}</div>`},
  ...specialists.map((p,i)=>({id:`10${"abcdefg"[i]}-especialista-${i+1}`, date:i===0?"2026-11-30":"2026-12-01", tag:"Quem estará à mesa", body:`
    <div class="kicker">${p.papel}</div>
    <div class="spot" style="margin-top:44px">${av(p)}</div>
    <h1 style="font-size:80px;margin-top:40px">${p.nome}</h1>
    <p class="lead gold" style="margin-top:14px;font-weight:600;font-size:30px">${p.cargo}</p>
    <p class="spot-bio">${p.bio}</p>`})),
  {id:"11-ecossistema", date:"2026-11-30", cap:7, tag:"Ecossistema", body:`
    <div class="kicker">Análise do ecossistema</div>
    <h1>Ninguém protege um patrimônio <em>sozinho.</em></h1>
    <div style="margin-top:40px;display:flex;justify-content:center">${ecoSVG()}</div>
    <div class="question">Quem conversa com quem no seu patrimônio hoje?</div>`},
  {id:"12-vespera", date:"2026-12-02", cap:8, tag:"Amanhã", body:`
    <div class="kicker">Está tudo pronto</div>
    <h1>Amanhã, <em>à mesa.</em></h1>
    <dl class="info">
      <dt>Data</dt><dd>${E.dataExtenso}</dd>
      <dt>Horário</dt><dd>${E.horario}</dd>
      <dt>Local</dt><dd>${E.local}</dd>
      <dt>Endereço</dt><dd>${E.endereco}</dd>
      <dt>Traje</dt><dd>${E.traje}</dd>
    </dl>
    <div class="question">Do mundo à mesa: três cenários, uma conversa, ${E.vagas} convidados.</div>`},
  {id:"13-e-hoje", date:"2026-12-03", tag:"Hoje", light:1, body:`
    <div class="kicker">${E.dataExtenso}</div>
    <div class="big-date" style="margin-top:80px;font-size:260px">É hoje.</div>
    <p class="lead" style="margin-top:50px">${E.horario} · ${E.local}<br><span class="muted">${E.cidade}</span></p>
    <div class="question">Nos vemos à mesa.</div>`},
  {id:"14-obrigado", date:"2026-12-04", tag:"Pós-evento", light:1, body:`
    <div class="kicker">Obrigado pela noite</div>
    <h1>A conversa <em>continua.</em></h1>
    <p class="lead">Foi um prazer receber você em Joinville. Nos próximos dias, envio um resumo dos principais pontos e fico à disposição para aprofundarmos o seu caso — com calma, e sob medida.</p>
    <div class="question">Do mundo à mesa — e da mesa ao seu plano.</div>`},
];
cards.sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
cards.forEach((c,i)=>{c.id=String(i+1).padStart(2,"0")+"_"+dd(c.date).replace("/","-")+"_"+c.id.replace(/^\d+[a-z]?-/,"");});
document.getElementById("root").outerHTML = cards.map(shell).join("");
</script>
</body>
</html>
