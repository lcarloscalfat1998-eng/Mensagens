services:
  - type: web
    name: whatsapp-bot
    runtime: node
    rootDir: bot
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: ASSESSOR_NOME
        sync: false
      - key: EMPRESA_NOME
        sync: false
      - key: BOT_NOME
        value: Assistente
